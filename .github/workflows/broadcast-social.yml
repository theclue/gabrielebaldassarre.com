name: Broadcast to Social

on:
  workflow_run:
    workflows: ["Deploy blog on Cloudflare Pages"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      post_path:
        description: 'Specific post to broadcast (path under _posts/)'
        required: false
        type: string

permissions:
  contents: write
  models: read
  pull-requests: write

concurrency:
  group: social-broadcast
  cancel-in-progress: false

jobs:
  broadcast:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies 📦
        run: pip install pyyaml

      - name: Find posts to broadcast 🔍
        id: find
        env:
          INPUT_POST_PATH: ${{ inputs.post_path }}
        run: |
          : > /tmp/to_process.txt
          BRANCH="automation/social-broadcast"
          git fetch origin main "$BRANCH" 2>/dev/null || git fetch origin main

          if [ -n "$INPUT_POST_PATH" ]; then
            candidate="_posts/${INPUT_POST_PATH#_posts/}"
            [ -f "$candidate" ] && echo "$candidate" >> /tmp/to_process.txt
          else
            # Controlla i post toccati nell'ultimo commit (o tutti quelli con broadcast attivo e non inviato)
            python3 _scripts/ci/changed_posts.py --format file > /tmp/candidates.txt
            if [ ! -s /tmp/candidates.txt ]; then
              find _posts -name '*.md' -o -name '*.Rmd' | sort > /tmp/candidates.txt
            fi
            while read -r post; do
              [ -z "$post" ] || [ ! -f "$post" ] && continue
              grep -q 'broadcast:\s*false' "$post" 2>/dev/null && continue
              grep -q 'sent:\s*true' "$post" 2>/dev/null && continue
              if git show "origin/${BRANCH}:${post}" 2>/dev/null | grep -q 'sent:\s*true'; then
                echo "  SALTA (già marcato in ${BRANCH}): $post"
                continue
              fi
              grep -q 'broadcast:' "$post" 2>/dev/null && echo "$post" >> /tmp/to_process.txt
            done < /tmp/candidates.txt
          fi

          count=$(wc -l < /tmp/to_process.txt | tr -d ' ')
          echo "Post da elaborare: ${count:-0}"
          cat /tmp/to_process.txt

          if [ "${count:-0}" -eq 0 ]; then
            echo "no_posts=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_posts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Broadcast posts 📡
        if: steps.find.outputs.no_posts != 'true'
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          xargs python3 _scripts/broadcast.py < /tmp/to_process.txt

      - name: Update single broadcast PR 📨
        if: success() && steps.find.outputs.no_posts != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --name-only | grep -q '^_posts/'; then
            echo "Nessuna modifica al frontmatter da salvare."
            exit 0
          fi

          BRANCH="automation/social-broadcast"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/broadcast_staged
          git diff --name-only -- '_posts/' > /tmp/modified_posts.txt
          while read -r post; do
            [ -z "$post" ] && continue
            mkdir -p "/tmp/broadcast_staged/$(dirname "$post")"
            cp "$post" "/tmp/broadcast_staged/$post"
          done < /tmp/modified_posts.txt

          HAS_REMOTE_BRANCH=0
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            HAS_REMOTE_BRANCH=1
            git diff --name-only origin/main.."origin/$BRANCH" -- '_posts/' > /tmp/prior_posts.txt || true
          fi

          git checkout -B "$BRANCH" origin/main

          if [ "$HAS_REMOTE_BRANCH" -eq 1 ] && [ -s /tmp/prior_posts.txt ]; then
            while read -r post; do
              [ -z "$post" ] || [ ! -f "$post" ] && continue
              if ! grep -Fxq "$post" /tmp/modified_posts.txt; then
                if git show "origin/$BRANCH:$post" 2>/dev/null | grep -q 'sent:\s*true'; then
                  sed -i 's/sent:\s*false/sent: true/' "$post"
                  git add "$post"
                fi
              fi
            done < /tmp/prior_posts.txt
          fi

          while read -r post; do
            [ -z "$post" ] && continue
            cp "/tmp/broadcast_staged/$post" "$post"
            git add "$post"
          done < /tmp/modified_posts.txt

          if git diff --cached --quiet; then
            echo "Nessuna nuova modifica rispetto a ${BRANCH}."
            exit 0
          fi

          git commit -m "chore(broadcast): mark broadcasted post(s) as sent"
          git push --force-with-lease origin "$BRANCH"

          {
            echo "## Social Broadcast Automatico"
            echo ""
            echo "Bozze create su Buffer e flag \`broadcast.sent: true\` aggiornato nei seguenti articoli:"
            echo ""
            git diff --name-only origin/main.."$BRANCH" -- '_posts/' | sed 's/^/- `/' | sed 's/$/`/'
          } > /tmp/pr_body.md

          EXISTING=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // ""')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body-file /tmp/pr_body.md
            echo "PR #${EXISTING} aggiornata."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(broadcast): aggiorna stato social post inviati" \
              --body-file /tmp/pr_body.md
          fi
