name: Deploy blog on Cloudflare Pages

on:
  push:
    branches: [main, master]
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**.md"
      - "**.Rmd"
      - "**.R"
      - "**.rb"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/broadcast-social.yml"
      - "!.github/workflows/seo-pipeline.yml"
      - "!.github/workflows/deploy-on-cloudflare-pages.yml"
      - "!README.md"
      - "!docs/**"
      - "!wiki/**"
  pull_request:
    branches: [main, master]
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**.md"
      - "**.Rmd"
      - "**.R"
      - "**.rb"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/broadcast-social.yml"
      - "!.github/workflows/seo-pipeline.yml"
      - "!.github/workflows/deploy-on-cloudflare-pages.yml"
      - "!README.md"
      - "!docs/**"
      - "!wiki/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker (Buildx) 🐋
        uses: docker/setup-buildx-action@v4
      - name: Build 🔧
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        run: make site
      - name: Verifica build 🔍
        run: |
          if [ ! -d _site ]; then
            echo "Build fallita: _site/ non trovata"
            exit 1
          fi

      - name: Valida immagini e asset 🔬
        run: python3 _scripts/ci/validate_assets.py

      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./_site --project-name=gabrielebaldassarre
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  warmup-cloudinary:
    if: github.event_name == 'push'
    needs: build_and_deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Warmup Cloudinary 🔥
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        run: python3 _scripts/ci/warmup_cloudinary.py "${{ github.event.before }}"
